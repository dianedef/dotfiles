# Basic settings
set -g default-terminal "tmux-256color"
set -g history-limit 100000
set -g mouse on
set -g renumber-windows on
set -g set-clipboard on

# Terminal overrides for proper color/underline support
set -g terminal-overrides ',xterm-256color:Tc'
set -as terminal-overrides ',xterm-ghostty:Tc'
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g terminal-features 'xterm*:RGB:mouse:clipboard:strikethrough:usstyle'

# Prefix key
set -g prefix C-w
unbind C-b
bind C-w send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Better splitting
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# Pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copy mode
setw -g mode-keys vi
bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind -T copy-mode-vi r send -X rectangle-toggle

# Raccourci pour voir tous les onglets dans un menu (utile quand trop plein)
bind-key w choose-window

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1

# Don't rename windows automatically
set-option -g allow-rename off

# Escape time
set -sg escape-time 1

# Pane borders
set -g pane-border-style fg=black
set -g pane-active-border-style fg=colour198

# Message text
set -g message-style fg=colour198,bg=black

# Pane indicators
set -g display-panes-active-colour colour33
set -g display-panes-colour colour166
set -g display-panes-time 1000

# Clock
set -g clock-mode-colour colour64
set -g clock-mode-style 24

# Bell
set -g window-status-bell-style fg=colour255,bg=colour1,blink

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'nhdaly/tmux-better-mouse-mode'

# tmux-better-mouse-mode settings
set -g @scroll-speed-num-lines-per-scroll 3
set -g @emulate-scroll-for-no-mouse-alternate-buffer "on"

# Initialize TMUX plugin manager
run '~/.tmux/plugins/tpm/tpm'

# Status bar — APRÈS les plugins pour ne pas être écrasé par tmux-sensible
set -g status on
set -g status-position bottom
set -g status-interval 60
set -g status 2

# Ligne 1 (status-format[0]) : onglets compacts + session + date/heure Paris
set -g status-format[0] '#[bg=black]#{W:#{?window_active,#[bg=colour226#,fg=#000000#,bold] #I ,#[bg=colour238#,fg=#ffffff] #I }}#[bg=colour226#,fg=#000000#,bold] #W #[align=right]#[bg=colour198#,fg=#ffffff] #S #[bg=colour238#,fg=#ffffff] %d/%m #[bg=colour226#,fg=#000000#,bold] #(TZ=Europe/Paris date +%%H:%%M) '

# Ligne 2 (status-format[1]) : noms des onglets, actif = * pour gagner de la place
set -g status-format[1] '#[bg=colour198#,fg=#ffffff]#{W:#{?window_active,#[bg=colour226#,fg=#000000#,bold] * #[bg=colour198#,fg=#ffffff], #W }}'
