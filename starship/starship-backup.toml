# Starship Configuration - Simple & Clean for Android/Termux
# Optimized for small screens and SSH usage

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Blank line before each prompt (cleaner look)
add_newline = true

# Quick timeout for SSH responsiveness
scan_timeout = 10
command_timeout = 500

# Simple format - NO DECORATIVE LINES
format = """
$custom.codespace\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$java\
$cmd_duration
$character"""

# Prompt character with emoji
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[❮](bold green)"

# Directory - compact with emoji and custom repo name
[directory]
truncation_length = 3
truncate_to_repo = true
format = "📁 [$path]($style) "
style = "bold cyan"
read_only = "🔒"
truncation_symbol = "…/"
# Custom repo name instead of URL
repo_root_format = "📁 [$repo_name]($style)[$path]($style) "
repo_root_style = "bold cyan"
fish_style_pwd_dir_length = 1

# Git branch
[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"
truncation_length = 15
truncation_symbol = "…"
# Only show repo name, not full URL
ignore_branches = ["main", "master"]

# Git status - with emojis and spaces
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
conflicted = "= "
ahead = "📤${count} "
behind = "📬${count} "
diverged = "⇕ "
up_to_date = "✅ "
untracked = "⚠️ ${count} "
stashed = "⏳${count} "
modified = "📝${count} "
staged = "🚀${count} "
deleted = "🧹${count} "

# Command duration - only if slow
[cmd_duration]
min_time = 2000
format = "[⏱ $duration]($style) "
style = "bold yellow"

# Languages - minimal icons
[nodejs]
format = "[$symbol$version]($style) "
symbol = "⬢ "
style = "green"

[python]
format = "[$symbol$version]($style) "
symbol = "🐍 "
style = "yellow"

[rust]
format = "[$symbol$version]($style) "
symbol = "🦀 "
style = "red"

[golang]
format = "[$symbol$version]($style) "
symbol = "🐹 "
style = "cyan"

[java]
format = "[$symbol$version]($style) "
symbol = "☕ "
style = "red"

# Docker - only when needed
[docker_context]
format = "[$symbol$context]($style) "
symbol = "🐳 "
style = "blue"
only_with_files = true

# Disable time (saves space)
[time]
disabled = true

# Disable battery (not useful in SSH)
[battery]
disabled = true

# Custom codespace detection section - ONLY show in real codespaces
[custom.codespace]
command = '''
if [ -n "$CODESPACE_NAME" ] && [ "$CODESPACES" = "true" ]; then
    echo "$CODESPACE_NAME"
fi
'''
when = '''test -n "$CODESPACE_NAME" && test "$CODESPACES" = "true"'''
format = '☁️ [$output]($style) '
style = 'bold blue'
shell = ["bash", "--noprofile", "--norc"]

# Username - only show when not current user
[username]
format = "[$user]($style)@"
style_user = "bold green"
style_root = "bold red"
show_always = false
disabled = false

# Hostname - only show in SSH or when different
[hostname]
format = "[$hostname]($style) "
style = "bold dimmed white"
ssh_only = true
disabled = false

# Disable OS icon (obvious from hostname)
[os]
disabled = true
