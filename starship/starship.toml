# Username - only show when not current user or in codespace
[username]
format = "[$user]($style)@"
style_user = "bold green"
style_root = "bold red"
show_always = false
disabled = false

# Hostname - built-in module
[hostname]
disabled = false
ssh_only = false
trim_at = ""
format = "[$hostname]($style) "
style = "bold dimmed white"
aliases = {"ubuntu-s-1vcpu-2gb-amd-ams3-01" = "cloud"}

# Directory - smart formatting
[directory]
truncation_length = 3
truncate_to_repo = false
format = "[$path]($style) "
style = "bold cyan"
read_only = "🔒"
truncation_symbol = "…/"
fish_style_pwd_dir_length = 1

# Git branch - clean formatting
[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"
truncation_length = 15
truncation_symbol = "…"

# Git status - with emojis
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
conflicted = "= "
ahead = "📤${count} "
behind = "📬${count} "
diverged = "⇕ "
up_to_date = "✅ "
untracked = "⚠️ ${count} "
stashed = "⏳${count} "
modified = "📝${count} "
staged = "🚀${count} "
deleted = "🧹${count} "

# Command duration - only if slow
[cmd_duration]
min_time = 2000
format = "[⏱ $duration]($style) "
style = "bold yellow"

# Languages - minimal icons
[nodejs]
format = "[$symbol$version]($style) "
symbol = "⬢ "
style = "green"

[python]
format = "[$symbol$version]($style) "
symbol = "🐍 "
style = "yellow"

[rust]
format = "[$symbol$version]($style) "
symbol = "🦀 "
style = "red"

[golang]
format = "[$symbol$version]($style) "
symbol = "🐹 "
style = "cyan"

[java]
format = "[$symbol$version]($style) "
symbol = "☕ "
style = "red"

# Docker - only when needed
[docker_context]
format = "[$symbol$context]($style) "
symbol = "🐳 "
style = "blue"
only_with_files = true

# Disable unnecessary modules
[time]
disabled = true

[battery]
disabled = true

[os]
disabled = true

[package]
disabled = true

[conda]
disabled = true

[memory_usage]
disabled = true