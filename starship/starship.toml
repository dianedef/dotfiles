# Starship Configuration - Local Development
# Optimized for local development, no codespace indicators

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Blank line before each prompt
add_newline = true

# Responsive timeouts
scan_timeout = 10
command_timeout = 2000

# Clean format with cloud indicator for codespaces
format = """
${custom.codespace}\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$java\
$cmd_duration
$character"""

# Prompt character
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[❮](bold green)"

# Username - hide in codespaces
[username]
disabled = true

# Hostname - hide in codespaces
[hostname]
disabled = true

# Directory - just repo name when in repo, short path otherwise
[directory]
truncation_length = 1
truncate_to_repo = true
format = "[$path]($style) "
style = "bold cyan"
read_only = "🔒"
truncation_symbol = "…/"
repo_root_format = "[$repo_name]($style) "
repo_root_style = "bold cyan"
home_symbol = "~"

# Git branch
[git_branch]
format = "[$symbol$branch]($style) "
symbol = " "
style = "bold purple"
truncation_length = 15
truncation_symbol = "…"

# Git status
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold yellow"
conflicted = "= "
ahead = "📤${count} "
behind = "📬${count} "
diverged = "⇕ "
up_to_date = "✅ "
untracked = "⚠️ ${count} "
stashed = "⏳${count} "
modified = "📝${count} "
staged = "🚀${count} "
deleted = "🧹${count} "

# Command duration
[cmd_duration]
min_time = 2000
format = "[⏱ $duration]($style) "
style = "bold yellow"

# Language versions
[nodejs]
format = "[$symbol$version]($style) "
symbol = "⬢ "
style = "green"

[python]
format = "[$symbol$version]($style) "
symbol = "🐍 "
style = "yellow"

[rust]
format = "[$symbol$version]($style) "
symbol = "🦀 "
style = "red"

[golang]
format = "[$symbol$version]($style) "
symbol = "🐹 "
style = "cyan"

[java]
format = "[$symbol$version]($style) "
symbol = "☕ "
style = "red"

# Docker context
[docker_context]
format = "[$symbol$context]($style) "
symbol = "🐳 "
style = "blue"
only_with_files = true

# Disable unnecessary modules for local development
[time]
disabled = true

[battery]
disabled = true

[os]
disabled = true

[package]
disabled = true

[conda]
disabled = true

[memory_usage]
disabled = true

# Cloud indicator for codespaces
[custom.codespace]
disabled = false
command = 'echo "☁️"'
when = 'test -n "$CODESPACE_NAME"'
format = '[$output]($style) '
style = 'bold blue'
shell = ["bash", "--noprofile", "--norc"]

[custom.env]
disabled = true