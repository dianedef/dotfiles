# Starship Configuration - Clean & Smart
# Detects environment automatically (local vs codespace)

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Blank line before each prompt (cleaner look)
add_newline = true

# Quick timeout for SSH responsiveness
scan_timeout = 10
command_timeout = 500

# Format adapts based on environment
format = """$custom.env $username $hostname $directory $git_branch $git_status $nodejs $python $rust $golang $java $cmd_duration
$character"""

# Prompt character with emoji
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[❮](bold green)"

# Environment indicator (codespace/local/docker)
[custom.env]
command = '''
if [ "$CODESPACES" = "true" ]; then
    echo "☁️"
elif [ -n "$SSH_CLIENT" ] || [ -n "$SSH_TTY" ]; then
    echo "🌐"
elif [ -f /.dockerenv ]; then
    echo "🐳"
else
    echo "💻"
fi
'''
when = "true"
format = '[$output]($style) '
style = 'bold blue'
shell = ["bash", "--noprofile", "--norc"]

