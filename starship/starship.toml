# Starship Configuration - Clean & Smart
# Detects environment automatically (local vs codespace)

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Blank line before each prompt (cleaner look)
add_newline = true

# Quick timeout for SSH responsiveness
scan_timeout = 10
command_timeout = 500

# Format adapts based on environment
format = """
${custom.codespace}\
${custom.env}\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$python\
$rust\
$golang\
$java\
$cmd_duration
$character"""

# Prompt character with emoji
[character]
success_symbol = "[➜](bold green)"
error_symbol = "[✗](bold red)"
vicmd_symbol = "[❮](bold green)"

# Environment indicator (codespace/local/docker)
[custom.env]
command = '''
if [ "$CODESPACES" = "true" ]; then
    echo "☁️"
elif [ -n "$SSH_CLIENT" ] || [ -n "$SSH_TTY" ]; then
    echo "🌐"
elif [ -f /.dockerenv ]; then
    echo "🐳"
else
    echo "💻"
fi
'''
when = true
format = '[$output]($style)'
style = 'bold blue'
shell = ["bash", "--noprofile", "--norc"]

# Custom codespace detection - ONLY in real codespaces
# Reads cached display name from csrename, falls back to CODESPACE_NAME
[custom.codespace]
command = '''
if [ -f ~/.codespace_displayname ]; then
    cat ~/.codespace_displayname
elif [ -n "$CODESPACE_NAME" ]; then
    echo "$CODESPACE_NAME"
fi
'''
when = '''test -n "$CODESPACE_NAME" && test "$CODESPACES" = "true"'''
format = '[$output]($style) '
style = 'bold cyan'
shell = ["bash", "--noprofile", "--norc"]

# Username - only show when not current user or in codespace
[username]
format = " [$user]($style) on "
style_user = "bold green"
style_root = "bold red"
show_always = false
disabled = false

# Hostname - only show in SSH or codespace
[hostname]
format = "[$hostname]($style)"
style = "bold dimmed white"
ssh_only = false
disabled = false

# Directory - smart formatting
[directory]
truncation_length = 3
truncate_to_repo = true
format = " in [$path]($style)"
style = "bold cyan"
read_only = "🔒"
truncation_symbol = "…/"
repo_root_format = " in [$repo_root]($style)[$path]($style)"
repo_root_style = "bold cyan"
fish_style_pwd_dir_length = 1

# Git branch - clean formatting
[git_branch]
format = " on [$symbol$branch]($style)"
symbol = " "
style = "bold purple"
truncation_length = 15
truncation_symbol = "…"

# Git status - with emojis
[git_status]
format = '( [\[$all_status$ahead_behind\]]($style))'
style = "bold yellow"
conflicted = "= "
ahead = "📤${count} "
behind = "📬${count} "
diverged = "⇕ "
up_to_date = "✅ "
untracked = "⚠️ ${count} "
stashed = "⏳${count} "
modified = "📝${count} "
staged = "🚀${count} "
deleted = "🧹${count} "

# Command duration - only if slow
[cmd_duration]
min_time = 2000
format = " [⏱ $duration]($style)"
style = "bold yellow"

# Languages - minimal icons with "via"
[nodejs]
format = " via [$symbol$version]($style)"
symbol = "⬢ "
style = "green"

[python]
format = " via [$symbol$version]($style)"
symbol = "🐍 "
style = "yellow"

[rust]
format = " via [$symbol$version]($style)"
symbol = "🦀 "
style = "red"

[golang]
format = " via [$symbol$version]($style)"
symbol = "🐹 "
style = "cyan"

[java]
format = " via [$symbol$version]($style)"
symbol = "☕ "
style = "red"

# Docker - only when needed
[docker_context]
format = "[$symbol$context]($style) "
symbol = "🐳 "
style = "blue"
only_with_files = true

# Disable unnecessary modules
[time]
disabled = true

[battery]
disabled = true

[os]
disabled = true

[package]
disabled = true

[conda]
disabled = true

[memory_usage]
disabled = true