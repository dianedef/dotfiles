# Starship configuration
# https://starship.rs/config/

# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Wait 10 milliseconds for starship to check files under the current directory
scan_timeout = 10

# Timeout for commands executed by starship (in milliseconds)
command_timeout = 500

# Format configuration
format = """
[┌───────────────────────>](bold green)
[│](bold green)$directory$git_branch$git_status$git_state
[│](bold green)$character
"""

right_format = """
$nodejs\
$python\
$rust\
$golang\
$java\
$cmd_duration\
$time
"""

# Prompt character configuration
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vicmd_symbol = "[❮](bold green)"

# Directory configuration
[directory]
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style)[$read_only]($read_only_style) "
style = "bold cyan"
read_only = " 🔒"
read_only_style = "red"
truncation_symbol = "…/"

# Git branch
[git_branch]
format = "on [$symbol$branch(:$remote_branch)]($style) "
symbol = " "
style = "bold purple"
truncation_length = 20
truncation_symbol = "…"

# Git status
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold red"
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
up_to_date = "✓"
untracked = "?${count}"
stashed = "$${count}"
modified = "!${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "✘${count}"

# Git state (for rebase, merge, etc.)
[git_state]
format = '\([$state( $progress_current of $progress_total)]($style)\) '
style = "bright-black"
rebase = "REBASING"
merge = "MERGING"
revert = "REVERTING"
cherry_pick = "CHERRY-PICKING"
bisect = "BISECTING"
am = "AM"
am_or_rebase = "AM/REBASE"

# Command duration
[cmd_duration]
min_time = 500
format = "took [$duration]($style) "
style = "bold yellow"

# Time
[time]
disabled = false
format = '🕙[$time]($style) '
style = "bold white"
time_format = "%T"

# Language configurations

[nodejs]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold green"

[python]
format = 'via [${symbol}${pyenv_prefix}(${version} )(\($virtualenv\) )]($style)'
symbol = " "
style = "bold yellow"
pyenv_version_name = false

[rust]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"

[golang]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold cyan"

[java]
format = "via [$symbol($version )]($style)"
symbol = " "
style = "bold red"

# Package version
[package]
format = "is [$symbol$version]($style) "
symbol = "📦 "
style = "208"
display_private = false
disabled = false

# Docker context
[docker_context]
format = "via [$symbol$context]($style) "
symbol = " "
style = "blue bold"
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]
detect_folders = []
disabled = false

# AWS
[aws]
format = 'on [$symbol($profile )(\($region\) )(\[$duration\] )]($style)'
symbol = "☁️  "
style = "bold yellow"
disabled = false

# Memory usage
[memory_usage]
disabled = true
threshold = 75
format = "via $symbol [${ram_pct}]($style) "
symbol = " "
style = "bold dimmed white"

# Battery
[battery]
full_symbol = "🔋 "
charging_symbol = "⚡️ "
discharging_symbol = "💀 "
unknown_symbol = "❓ "
empty_symbol = "🪫 "

[[battery.display]]
threshold = 10
style = "bold red"

[[battery.display]]
threshold = 30
style = "bold yellow"

# Operating system symbols
[os]
format = "[$symbol]($style)"
style = "bold white"
disabled = true

[os.symbols]
Alpaquita = " "
Alpine = " "
Amazon = " "
