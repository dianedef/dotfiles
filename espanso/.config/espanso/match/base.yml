# Espanso Configuration - Modern & French locale
# Placeholders {{USER_NAME}} and {{USER_EMAIL}} are replaced during dotfiles install

matches:
  # ═══════════════════════════════════════════════════════════════════════════
  # QUICK RESPONSES
  # ═══════════════════════════════════════════════════════════════════════════
  - trigger: ";thx"
    replace: "Merci !"
  - trigger: ";ty"
    replace: "Thank you!"
  - trigger: ";np"
    replace: "Pas de souci"
  - trigger: ";npp"
    replace: "No problem"
  - trigger: ";pls"
    replace: "S'il te plaît"
  - trigger: ";plz"
    replace: "Please"
  - trigger: ";cdlt"
    replace: "Cordialement,"
  - trigger: ";kr"
    replace: "Kind regards,"
  - trigger: ";br"
    replace: "Best regards,"
  - trigger: ";asap"
    replace: "dès que possible"
  - trigger: ";afk"
    replace: "Je reviens dans quelques minutes"
  - trigger: ";omw"
    replace: "J'arrive !"
  - trigger: ";idk"
    replace: "Je ne sais pas"
  - trigger: ";lmk"
    replace: "Tiens-moi au courant"
  - trigger: ";fyi"
    replace: "Pour info"

  # ═══════════════════════════════════════════════════════════════════════════
  # DATE & TIME (French locale)
  # ═══════════════════════════════════════════════════════════════════════════
  - trigger: ";date"
    replace: "{{out}}"
    vars:
      - name: out
        type: date
        params:
          format: "%d/%m/%Y"
  - trigger: ";datel"
    replace: "{{out}}"
    vars:
      - name: out
        type: date
        params:
          format: "%A %d %B %Y"
          locale: "fr-FR"
  - trigger: ";time"
    replace: "{{out}}"
    vars:
      - name: out
        type: date
        params:
          format: "%H:%M"
  - trigger: ";now"
    replace: "{{out}}"
    vars:
      - name: out
        type: date
        params:
          format: "%d/%m/%Y %H:%M"
  - trigger: ";iso"
    replace: "{{out}}"
    vars:
      - name: out
        type: date
        params:
          format: "%Y-%m-%dT%H:%M:%S%z"
  - trigger: ";ts"
    replace: "{{out}}"
    vars:
      - name: out
        type: date
        params:
          format: "%Y%m%d_%H%M%S"
  - trigger: ";week"
    replace: "Semaine {{out}}"
    vars:
      - name: out
        type: date
        params:
          format: "%W"
  - trigger: ";dow"
    replace: "{{out}}"
    vars:
      - name: out
        type: date
        params:
          format: "%A"
          locale: "fr-FR"
  - trigger: ";month"
    replace: "{{out}}"
    vars:
      - name: out
        type: date
        params:
          format: "%B"
          locale: "fr-FR"
  - trigger: ";year"
    replace: "{{out}}"
    vars:
      - name: out
        type: date
        params:
          format: "%Y"

  # ═══════════════════════════════════════════════════════════════════════════
  # PERSONAL INFO (injected during install)
  # ═══════════════════════════════════════════════════════════════════════════
  - trigger: ";name"
    replace: "{{USER_NAME}}"
  - trigger: ";email"
    replace: "{{USER_EMAIL}}"
  - trigger: ";gh"
    replace: "https://github.com/{{GITHUB_USERNAME}}"
  - trigger: ";sig"
    replace: |
      --
      {{USER_NAME}}
      {{USER_EMAIL}}

  # ═══════════════════════════════════════════════════════════════════════════
  # DEV - Code snippets
  # ═══════════════════════════════════════════════════════════════════════════
  - trigger: ";todo"
    replace: "// TODO: "
  - trigger: ";fixme"
    replace: "// FIXME: "
  - trigger: ";hack"
    replace: "// HACK: "
  - trigger: ";note"
    replace: "// NOTE: "
  - trigger: ";bug"
    replace: "// BUG: "
  - trigger: ";clog"
    replace: "console.log($|$)"
  - trigger: ";plog"
    replace: "print($|$)"
  - trigger: ";dbg"
    replace: "debugger;"
  - trigger: ";imp"
    replace: "import { $|$ } from '';"
  - trigger: ";expd"
    replace: "export default "
  - trigger: ";afn"
    replace: "async function $|$() {\n  \n}"
  - trigger: ";arrow"
    replace: "($|$) => {}"
  - trigger: ";trycatch"
    replace: |
      try {
        $|$
      } catch (error) {
        console.error(error);
      }

  # ═══════════════════════════════════════════════════════════════════════════
  # DEV - Git
  # ═══════════════════════════════════════════════════════════════════════════
  - trigger: ";gca"
    replace: "git commit -am \""
  - trigger: ";gcm"
    replace: "git commit -m \""
  - trigger: ";gps"
    replace: "git push origin "
  - trigger: ";gpl"
    replace: "git pull origin "
  - trigger: ";gco"
    replace: "git checkout "
  - trigger: ";gbr"
    replace: "git branch "
  - trigger: ";gmr"
    replace: "git merge "
  - trigger: ";grb"
    replace: "git rebase "
  - trigger: ";gst"
    replace: "git stash"
  - trigger: ";gstp"
    replace: "git stash pop"

  # ═══════════════════════════════════════════════════════════════════════════
  # MARKDOWN
  # ═══════════════════════════════════════════════════════════════════════════
  - trigger: ";h1"
    replace: "# "
  - trigger: ";h2"
    replace: "## "
  - trigger: ";h3"
    replace: "### "
  - trigger: ";cb"
    replace: "```\n$|$\n```"
  - trigger: ";cbjs"
    replace: "```javascript\n$|$\n```"
  - trigger: ";cbpy"
    replace: "```python\n$|$\n```"
  - trigger: ";cbsh"
    replace: "```bash\n$|$\n```"
  - trigger: ";link"
    replace: "[$|$](url)"
  - trigger: ";img"
    replace: "![$|$](url)"
  - trigger: ";task"
    replace: "- [ ] "
  - trigger: ";taskd"
    replace: "- [x] "
  - trigger: ";table"
    replace: |
      | Header 1 | Header 2 | Header 3 |
      |----------|----------|----------|
      | Cell 1   | Cell 2   | Cell 3   |

  # ═══════════════════════════════════════════════════════════════════════════
  # SYMBOLS & SPECIAL CHARS
  # ═══════════════════════════════════════════════════════════════════════════
  # Arrows
  - trigger: ";->"
    replace: "→"
  - trigger: ";<-"
    replace: "←"
  - trigger: ";=>"
    replace: "⇒"
  - trigger: ";<="
    replace: "⇐"
  - trigger: ";up"
    replace: "↑"
  - trigger: ";down"
    replace: "↓"
  # Currency
  - trigger: ";eur"
    replace: "€"
  - trigger: ";gbp"
    replace: "£"
  - trigger: ";usd"
    replace: "$"
  - trigger: ";btc"
    replace: "₿"
  # Math & Logic
  - trigger: ";deg"
    replace: "°"
  - trigger: ";+-"
    replace: "±"
  - trigger: ";neq"
    replace: "≠"
  - trigger: ";leq"
    replace: "≤"
  - trigger: ";geq"
    replace: "≥"
  - trigger: ";inf"
    replace: "∞"
  - trigger: ";sqrt"
    replace: "√"
  - trigger: ";sum"
    replace: "∑"
  - trigger: ";pi"
    replace: "π"
  # Other
  - trigger: ";copy"
    replace: "©"
  - trigger: ";reg"
    replace: "®"
  - trigger: ";tm"
    replace: "™"
  - trigger: ";check"
    replace: "✓"
  - trigger: ";cross"
    replace: "✗"
  - trigger: ";star"
    replace: "★"
  - trigger: ";heart"
    replace: "♥"
  - trigger: ";bullet"
    replace: "•"
  - trigger: ";ellip"
    replace: "…"
  - trigger: ";shrug"
    replace: "¯\\_(ツ)_/¯"
  - trigger: ";lenny"
    replace: "( ͡° ͜ʖ ͡°)"
  - trigger: ";flip"
    replace: "(╯°□°)╯︵ ┻━┻"

  # ═══════════════════════════════════════════════════════════════════════════
  # LOREM IPSUM
  # ═══════════════════════════════════════════════════════════════════════════
  - trigger: ";lorem"
    replace: "Lorem ipsum dolor sit amet, consectetur adipiscing elit."
  - trigger: ";loremp"
    replace: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat."

  # ═══════════════════════════════════════════════════════════════════════════
  # SYSTEM INFO (shell commands)
  # ═══════════════════════════════════════════════════════════════════════════
  - trigger: ";ip"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "curl -s https://api.ipify.org"
  - trigger: ";host"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "hostname"
  - trigger: ";pwd"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "pwd"
  - trigger: ";uuid"
    replace: "{{output}}"
    vars:
      - name: output
        type: shell
        params:
          cmd: "uuidgen 2>/dev/null || cat /proc/sys/kernel/random/uuid"

  # ═══════════════════════════════════════════════════════════════════════════
  # FORMS - Dynamic input
  # ═══════════════════════════════════════════════════════════════════════════
  - trigger: ";meet"
    replace: "📅 Réunion: {{title}}\n📍 Lieu: {{location}}\n🕐 Heure: {{time}}\n👥 Participants: {{participants}}"
    vars:
      - name: title
        type: form
        params:
          layout: "Titre de la réunion: [[title]]"
      - name: location
        type: form
        params:
          layout: "Lieu: [[location]]"
      - name: time
        type: form
        params:
          layout: "Heure: [[time]]"
      - name: participants
        type: form
        params:
          layout: "Participants: [[participants]]"
