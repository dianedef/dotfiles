# >>> shipflow codex autonomous >>>
approval_policy = "never"
sandbox_mode = "danger-full-access"
# <<< shipflow codex autonomous <<<

# >>> shipflow codex tui >>>
tui.status_line = ["model-with-reasoning", "current-dir", "context-remaining", "five-hour-limit", "weekly-limit"]
tui.terminal_title = ["spinner", "thread", "project"]
# <<< shipflow codex tui <<<


model = "gpt-5.5"
model_reasoning_effort = "high"
# >>> shipflow codex rmcp >>>
[beta]
rmcp = true
# <<< shipflow codex rmcp <<<

[features]
# `codex_apps` currently fails to initialize from this environment because
# `https://chatgpt.com` is returning a Cloudflare challenge (HTTP 403).
# Disabling `apps` avoids MCP startup failure spam; re-enable once the
# network can reach ChatGPT without the challenge.
apps = false

