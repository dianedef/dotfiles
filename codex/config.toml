model = "gpt-5.3-codex-spark"
approval_policy = "on-request"
sandbox_mode = "danger-full-access"
model_reasoning_effort = "low"

[features]
# `codex_apps` currently fails to initialize from this environment because
# `https://chatgpt.com` is returning a Cloudflare challenge (HTTP 403).
# Disabling `apps` avoids MCP startup failure spam; re-enable once the
# network can reach ChatGPT without the challenge.
apps = false

[projects."/home/claude/tubeflow"]
trust_level = "trusted"

[projects."/home/claude/tubeflow-site"]
trust_level = "trusted"

[projects."/home/claude"]
trust_level = "trusted"

[projects."/home/claude/ContentFlowz_app"]
trust_level = "trusted"

[projects."/home/claude/tubeflow-app"]
trust_level = "trusted"

[projects."/home/claude/socialflow"]
trust_level = "trusted"

[projects."/home/claude/contentflow_lab"]
trust_level = "trusted"

[projects."/home/claude/contentflow_app"]
trust_level = "trusted"

[projects."/home/claude/NoCocaïne"]
trust_level = "trusted"

[projects."/home/claude/gocharbon_quiz"]
trust_level = "trusted"

[projects."/home/claude/jarretelacoke"]
trust_level = "trusted"

[projects."/home/claude/promptflow"]
trust_level = "trusted"

[projects."/home/claude/gocharbon"]
trust_level = "trusted"

[projects."/home/claude/dotfiles"]
