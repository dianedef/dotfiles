# Termux Properties
# Rechargement: termux-reload-settings

# Masquer réellement la barre de touches supplémentaires (extra keys).
extra-keys = []

# Ne pas forcer le plein écran depuis le script.
# Sur plusieurs versions Android/Termux, fullscreen + use-fullscreen-workaround
# peut laisser une grande zone noire inutilisable au-dessus du clavier.
fullscreen = false
use-fullscreen-workaround = false

# Thème sombre forcé
use-black-ui = true
night-mode = true

# Style du curseur
terminal-cursor-style = underline

# Désactiver le toast lors du changement de session
disable-terminal-session-change-toast = true

# Ouvrir les URLs cliquées dans le terminal
terminal-onclick-url-open = true
